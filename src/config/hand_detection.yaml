# MediaPipe Hand Detection Configuration
# Story 3.1: MediaPipe Hand Detection Setup
#
# Configuration for MediaPipe Hands library integration
# Performance target: 10+ FPS for hand landmark detection

# MediaPipe Hands Parameters
mediapipe:
  # Model complexity: 0 (lite), 1 (full)
  # Higher complexity = better accuracy but slower processing
  # Default: 0 for Pi5 - faster processing with minimal accuracy loss
  model_complexity: 0
  
  # Minimum confidence for hand detection (0.0-1.0)
  # Lower values = more detections but more false positives
  # Default: 0.3 for fast detection (optimized for speed)
  min_detection_confidence: 0.3
  
  # Minimum confidence for landmark tracking (0.0-1.0)
  # Once detected, tracks landmarks with this threshold
  # Default: 0.3 for fast tracking (optimized for speed)
  min_tracking_confidence: 0.3
  
  # Maximum number of hands to detect (1-2)
  # Default: 2 to support two-handed gestures
  max_num_hands: 2
  
  # Use static image mode (true/false)
  # false = video mode with tracking optimization
  # Default: false for continuous video processing
  static_image_mode: false

# Performance Settings
performance:
  # Target frames per second (10-30)
  # Must be >= 10 FPS for responsive interaction
  # Default: 30 FPS for Pi5 with model_complexity=0 (speed optimized)
  target_fps: 30
  
  # Maximum latency in milliseconds (0-100)
  # Maximum acceptable delay for hand detection
  # Default: 33ms (~30 FPS equivalent)
  max_latency_ms: 33
  
  # Enable landmark smoothing (true/false)
  # Smooths landmark positions over time for less jitter
  # Default: true for smoother gesture recognition
  enable_smoothing: true
  
  # Smoothing window size (frames)
  # Number of frames to average for smoothing
  # Default: 3 for responsive smoothing
  smoothing_window: 3
  
  # Enable performance logging (true/false)
  # Logs FPS, detection counts, and latency metrics
  # Default: true for monitoring
  enable_logging: true
  
  # Statistics update interval in frames
  # How often to recalculate FPS statistics
  # Default: 30 frames (~2 seconds at 15 FPS)
  stats_update_interval: 30

# Output Settings
output:
  # Include world landmarks (true/false)
  # World coordinates in meters relative to hand center
  # Default: true for distance estimation in Story 3.2
  include_world_landmarks: true
  
  # Landmark coordinate normalization (true/false)
  # true = normalized [0,1], false = pixel coordinates
  # Default: true for resolution independence
  normalize_coordinates: true

# Debug Settings
debug:
  # Enable debug visualization (true/false)
  # Draws hand landmarks on frames
  # Default: false for production
  enable_visualization: false
  
  # Save debug frames (true/false)
  # Saves annotated frames to disk
  # Default: false for production
  save_debug_frames: false
  
  # Debug output directory
  debug_output_dir: "cache/hand_detection_debug"
